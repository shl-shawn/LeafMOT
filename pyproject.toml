[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leafmot"
version = "0.1.0"
description = "Structural multi-object tracking of individual leaves in rosette plants"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["."]
include = ["LeafMOT", "LeafMOT.*"]
namespaces = false
