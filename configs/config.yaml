output:
  dir: ./output
  save_every: 10
  eval_every: 10
data:
  root: {PATH}
  train_proposal_json: {PATH}
  val_proposal_json: {PATH}
  train_split: train
  val_split: val
  image_exts:
  - .jpg
  - .jpeg
  - .png
  depth_dirname: depth_da3
  proposal_score_thresh: 0.05
  proposal_nms_iou_thresh: 0.8
  clip_length: 5
  sample_mode: random_interval
  sample_interval: 10
  exact_motrv2_anchor_logic: true
  exact_motrv2_rate_sampling: true
  normalize_rgb: true
  normalize_depth_for_encoder: true
  depth_invert: false
  depth_low_percentile: 1.0
  depth_high_percentile: 99.0
  depth_roi_conf_thresh: 0.25
  depth_roi_dilation_px: 8
  depth_roi_min_pixels: 300
  depth_roi_min_fraction: 0.001
  depth_roi_max_fraction: 0.8
model:
  encoder_pretrained_path: {PATH/DFormer_Tiny.pth.tar}
  encoder_out_channels: 256
  encoder_drop_path_rate: 0.1
  token_dim: 256
  roi_size: 7
  tokenizer_eps: 1.0e-06
  topo_dim: 64
  topo_edge_hidden_dim: 64
  topo_hidden_dim: 128
  topo_summary_dim: 16
  use_knn: true
  use_overlap: true
  use_radial: true
  knn_k: 4
  knn_depth_weight: 0.25
  overlap_iou_thresh: 0.05
  radial_angle_thresh: 0.52359877559
  radial_min_rho_gap: 0.0001
  topo_eps: 1.0e-06
  leaf_hidden_dim: 256
  box_hidden_dim: 256
  dev_hidden_dim: 256
  dev_frame_dim: 128
  assoc_hidden_dim: 256
  head_dropout: 0.0
  use_gru_updater: true
  use_box_head: false
loss:
  pos_iou_thresh: 0.4
  neg_iou_thresh: 0.3
  lambda_leaf: 1.0
  lambda_box: 1.0
  lambda_box_giou: 0.5
  lambda_assoc: 1.0
  lambda_dev: 1.0
  lambda_dev_sep: 1.0
  dev_sep_margin: 0.25
  leaf_use_focal: true
  leaf_focal_gamma: 2.0
  leaf_focal_alpha_pos: 0.25
  lambda_leaf_rank: 0.5
  leaf_rank_margin: 0.2
  leaf_duplicate_iou_thresh: 0.4
optim:
  epochs: 40
  lr_backbone: 1.0e-05
  lr_heads: 0.0001
  weight_decay: 0.0001
  warmup_epochs: 3
  min_lr_ratio: 0.01
  grad_clip_norm: 5.0
  amp: true
runtime:
  seed: 42
  deterministic: false
  num_workers: 4
  log_interval: 200
  sync_bn: true
  find_unused_parameters: true
  resume: null
